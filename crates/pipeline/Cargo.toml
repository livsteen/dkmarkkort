[package]
name = "dkmarkkort-pipeline"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
csv = "1.4.0"
dkmarkkort-core = { version = "0.1.0", path = "../core" }
futures-util = "0.3.34"
jiff = "0.2.37"
parquet = { version = "60.0.0", default-features = false, features = ["zstd"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2"] }
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1.53.1", features = ["full"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
