[package]
name = "dkmarkkort"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dkmarkkort-core = { version = "0.1.0", path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "fs"] }
topcoat = { version = "0.9.0", features = ["tailwind"] }

[build-dependencies]
topcoat = { version = "0.9.0", default-features = false, features = ["tailwind"] }
